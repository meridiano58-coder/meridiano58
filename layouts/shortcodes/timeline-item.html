<div class="timeline-item" style="margin-bottom: 1.8rem; position: relative;">
  <span style="position: absolute; left: -1.96rem; top: 0.3rem; width: 12px; height: 12px; border-radius: 50%; background-color: #1f77b4; box-shadow: 0 0 0 4px rgba(255,255,255,0.1);"></span>
  <div style="font-weight: 800; color: #1f77b4; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px;">{{ .Get "year" }}</div>
  <h4 style="margin: 0.2rem 0 0.4rem 0; font-size: 1.1em;">{{ .Get "title" }}</h4>
  <p style="margin: 0; font-size: 0.95em; line-height: 1.6; opacity: 0.9;">{{ .Inner }}</p>
</div>
